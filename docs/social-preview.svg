<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    Social preview for the GitHub repository. 1280x640 is what GitHub asks for.
    Rendered to social-preview.png beside this file:
      rsvg-convert -w 1280 -h 640 social-preview.svg -o social-preview.png
  -->
  <defs>
    <!-- Paper amber into markdown green into terminal cyan: the job, in one line. -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#101215"/>
  <ellipse cx="640" cy="470" rx="620" ry="150" fill="url(#bloom)"/>

  <rect x="80" y="104" width="220" height="8" rx="4" fill="url(#accent)"/>

  <text x="80" y="248" font-family="DejaVu Sans, Verdana, sans-serif" font-size="92" font-weight="bold" fill="#f3f4f6">BookMarker</text>
  <text x="80" y="300" font-family="DejaVu Sans, Verdana, sans-serif" font-size="30" fill="#8b93a1">an unofficial container for marker-pdf</text>

  <text x="80" y="382" font-family="DejaVu Sans, Verdana, sans-serif" font-size="38" fill="#e5e7eb">PDF → Markdown, one conversion at a time.</text>

  <!-- A page of text: one heading, two lines of body. -->
  <rect x="80" y="444" width="430" height="14" rx="7" fill="url(#accent)"/>
  <rect x="80" y="476" width="660" height="10" rx="5" fill="#39414e"/>
  <rect x="80" y="502" width="560" height="10" rx="5" fill="#39414e"/>

  <text x="80" y="566" font-family="DejaVu Sans, Verdana, sans-serif" font-size="24" fill="#5b6472">marker-pdf 1.10.2 · CUDA 12.6 · amd64</text>
  <text x="1200" y="566" font-family="DejaVu Sans, Verdana, sans-serif" font-size="24" fill="#5b6472" text-anchor="end">ghcr.io/hyper-dragon/bookmarker</text>
</svg>
