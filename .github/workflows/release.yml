name: release

on:
  # Every push to main publishes an image, so there is always something current to pull
  # onto a GPU box. A tag publishes a stable version on top of that.
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A branch pushed twice in a minute should not leave two builds racing for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Lowercase on purpose: a container image path may not contain capitals, and the
  # repository is called BookMarker.
  IMAGE_NAME: hyper-dragon/bookmarker
  MARKER_VERSION: "1.10.2"

jobs:
  publish:
    name: publish linux/amd64
    runs-on: ubuntu-latest
    permissions:
      # Write, because a tag also publishes a release page with the changelog entry.
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with version.txt produces an image whose own /health output
      # names a different release. Refuse rather than publish the ambiguity.
      - name: Tag must match version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          expected="${{ steps.version.outputs.value }}"
          if [ "$tag" != "$expected" ]; then
            echo "tag v$tag does not match version.txt ($expected)" >&2
            exit 1
          fi

      - name: Free disk space
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet/sdk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo swapoff -a && sudo rm -f /swapfile
          docker image prune -af || true
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      # amd64 only. The pinned CUDA base image publishes linux/amd64 alone, so an arm64
      # entry could not be produced without a CPU variant; that is a separate `-cpu` image,
      # not a matrix line. When it arrives, both halves go on native runners — never QEMU.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MARKER_VERSION=${{ env.MARKER_VERSION }}
            BOOKMARKER_VERSION=${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # A tag publishes a page as well as an image. The notes come from the changelog section
      # for that version — generated notes would only list commit subjects, which on a
      # squashed history say nothing at all.
      - name: Publish release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes="$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md)"

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "no changelog section for $version; falling back to generated notes"
            gh release create "$tag" --title "BookMarker $version" --generate-notes
          else
            printf 'BookMarker %s — packaging marker-pdf %s.\n\n%s\n\nThe image is `%s/%s:%s`.\n' \
              "$version" "$MARKER_VERSION" "$notes" "$REGISTRY" "$IMAGE_NAME" "$version" > /tmp/notes.md
            gh release create "$tag" --title "BookMarker $version" --notes-file /tmp/notes.md
          fi
