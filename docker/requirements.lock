# Hash-locked Python dependencies, installed on top of the pinned base image.
#
# These are the packages BookMarker adds to pytorch/pytorch. Everything the base image already
# ships — torch, numpy, requests and the rest — is pinned by that image's digest instead, so it
# deliberately doesn't appear here. Listing the base's own packages would mean pulling a 900 MB
# torch wheel from a second index to prove something the digest already proves.
#
# The build installs this with --require-hashes, so PyPI has to serve exactly these files. A
# re-uploaded or substituted artifact is a build failure, not a silent change.
#
# marker-pdf is not listed: it's installed from its release sdist with --no-deps, and that
# sdist's SHA-256 is the ADD --checksum in the Dockerfile.
#
# Regenerate after changing the engine pin, the surya pin, or the base image, then read the diff
# before committing it. UPSTREAM.md describes the procedure.
